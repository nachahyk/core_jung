name: core_jung
description: "Shared Material 3 theme (with custom-theme support), typography, spacing, and reusable pure-UI components with no business logic. Every mini-app builds its own visual identity on top of this."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
